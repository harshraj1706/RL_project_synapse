[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-arena"
version = "0.1.0"
description = "Generalizable Reinforcement Learning Racing Agent for SYNAPSE ARENA (VECTOR x AIC, IIIT Bhagalpur)"
authors = [
    { name = "Synapse Arena Team" }
]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "gymnasium>=0.29.1",
    "stable-baselines3>=2.3.2",
    "torch>=2.2.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
